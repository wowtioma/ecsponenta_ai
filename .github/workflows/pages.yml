# Веб-версия (GitHub Pages): статическая сборка демо.
#
# Включается один раз: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". После этого каждый пуш в ветку С
# пересобирает сайт и публикует его по адресу
# https://<owner>.github.io/<repo>/
#
# Бэкенд здесь не нужен: сайт собирается с VITE_USE_MOCK=true,
# ответы ассистента формируются демо-сценариями в браузере.

name: Deploy web demo

on:
  push:
    branches:
      - "С"
      - integration
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static demo
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE_PATH: "/ecsponenta_ai/"
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
